variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build-sonar


build-sonar:
  stage: build-sonar



  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"

  script:
    - cd "$env:CI_PROJECT_DIR"
    - cmd /c "cd /d %CI_PROJECT_DIR% && sonar-scanner -Dsonar.host.url=http://114.55.226.181:9002 -Dsonar.login=sqp_6d54c6a690fb7b79a921bb5e1afd46f204b1601fa -Dsonar.projectKey=yy-framework_view_400cef87-0887-4323-8413-c07f07bf4b90 -Dsonar.sources=. -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/public/**"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
